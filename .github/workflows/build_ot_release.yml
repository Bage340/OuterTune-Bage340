name: Build signed release-candidate APKs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Build core release APK
        run: ./gradlew assembleCoreRelease

      - name: Resolve ffmpeg libs
        run: |
          git clone --no-checkout https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ ffMetadataEx/ffmpeg-android-maker
          git -C ffMetadataEx/ffmpeg-android-maker checkout --detach fdd9e2482f232da676fdc5ef6622ca444238e9bc

      - name: Build full release APK
        run: ./gradlew assembleFullRelease

      - name: Upload signed release-candidate APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OuterTune-0.11.1-v91-signed-release-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk
