name: Build signed release-candidate APKs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Build Stable core release-candidate APK
        run: ./gradlew assembleStableCoreRelease

      - name: Resolve ffmpeg libs
        run: |
          git clone --no-checkout https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ ffMetadataEx/ffmpeg-android-maker
          git -C ffMetadataEx/ffmpeg-android-maker checkout --detach fdd9e2482f232da676fdc5ef6622ca444238e9bc

      - name: Build Stable full release-candidate APK
        run: ./gradlew assembleStableFullRelease

      - name: Verify Stable package, version, and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          : > SHA256SUMS.txt
          for ABI in core full; do
            if [ "$ABI" = core ]; then FLAVOR=stableCore; else FLAVOR=stableFull; fi
            APK="$(find "app/build/outputs/apk/${FLAVOR}/release" -name '*universal*.apk' -print -quit)"
            test -n "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK" > "${ABI}-signature.txt"
            grep -qi '98de410a5f16c5743ca3885d4ded7850fab73730a99bfd67f5912a5d91f6b736' "${ABI}-signature.txt"
            "$AAPT" dump badging "$APK" > "${ABI}-badging.txt"
            grep -q "package: name='com.dd3boh.outertune' versionCode='92' versionName='0.11.1'" "${ABI}-badging.txt"
            sha256sum "$APK" >> SHA256SUMS.txt
          done

      - name: Upload signed release-candidate APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OuterTune-0.11.1-v92-signed-release-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/stableCore/release/*.apk
            app/build/outputs/apk/stableFull/release/*.apk
            core-signature.txt
            full-signature.txt
            core-badging.txt
            full-badging.txt
            SHA256SUMS.txt
