name: Build signed Preview APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Set up separate Preview signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_KEYSTORE"
          test -n "$PREVIEW_KEYSTORE_PROPERTIES"
          printf '%s' "$PREVIEW_KEYSTORE" | base64 --decode > preview.jks
          printf '%s\n' "$PREVIEW_KEYSTORE_PROPERTIES" > preview-keystore.properties
        env:
          PREVIEW_KEYSTORE: ${{ secrets.PREVIEW_KEYSTORE }}
          PREVIEW_KEYSTORE_PROPERTIES: ${{ secrets.PREVIEW_KEYSTORE_PROPERTIES }}

      - name: Test and build Preview core APK
        run: ./gradlew testPreviewCoreDebugUnitTest assemblePreviewCoreUserdebug --no-daemon -DskipFormatKtlint

      - name: Verify signed test APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/previewCore/userdebug -name '*universal*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          SIGNER="$(sed -n 's/^.*certificate SHA-256 digest: //p' apk-signature.txt | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$SIGNER"
          test "${PREVIEW_CERT_SHA256,,}" = "$SIGNER"
          test "$SIGNER" != '98de410a5f16c5743ca3885d4ded7850fab73730a99bfd67f5912a5d91f6b736'
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.dd3boh.outertune.preview' versionCode='92' versionName='0.11.1'" apk-badging.txt
          cp "$APK" OuterTune-Bage340-0.11.1-v92-preview.apk
          sha256sum OuterTune-Bage340-0.11.1-v92-preview.apk | tee SHA256SUMS.txt
        env:
          PREVIEW_CERT_SHA256: ${{ vars.PREVIEW_CERT_SHA256 }}

      - name: Upload signed test APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OuterTune-Bage340-0.11.1-v92-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            OuterTune-Bage340-0.11.1-v92-preview.apk
            apk-signature.txt
            apk-badging.txt
            SHA256SUMS.txt
