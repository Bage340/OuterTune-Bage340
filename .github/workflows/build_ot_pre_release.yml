name: Build signed test APKs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Build core userdebug APK
        run: ./gradlew assembleCoreUserdebug

      - name: Verify signed test APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/core/userdebug -name '*universal*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -qi '98de410a5f16c5743ca3885d4ded7850fab73730a99bfd67f5912a5d91f6b736' apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.dd3boh.outertune' versionCode='91' versionName='0.11.1'" apk-badging.txt
          cp "$APK" OuterTune-0.11.1-v91-signed-test.apk
          sha256sum OuterTune-0.11.1-v91-signed-test.apk | tee SHA256SUMS.txt

      - name: Upload signed test APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OuterTune-0.11.1-v91-signed-test
          if-no-files-found: error
          retention-days: 14
          path: |
            OuterTune-0.11.1-v91-signed-test.apk
            apk-signature.txt
            apk-badging.txt
            SHA256SUMS.txt
