name: Build OuterTune APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
          cache-dependency-path: "**/*.gradle*"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Validate localized resources
        run: |
          python -m unittest scripts.tests.test_check_translations
          python scripts/check_translations.py

      - name: Test, lint, and build both unsigned channels
        run: ./gradlew testStableCoreDebugUnitTest testPreviewCoreDebugUnitTest compileStableFullDebugKotlin compilePreviewFullDebugKotlin lintStableCoreUserdebug lintPreviewCoreUserdebug assembleStableCoreUserdebug assemblePreviewCoreUserdebug --stacktrace -DskipFormatKtlint

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          for CHANNEL in stable preview; do
            if [ "$CHANNEL" = stable ]; then FLAVOR=stableCore; else FLAVOR=previewCore; fi
            APK="$(find "app/build/outputs/apk/${FLAVOR}/userdebug" -name '*universal*.apk' -print -quit)"
            test -n "$APK"
            "$AAPT" dump badging "$APK" | tee "apk-${CHANNEL}-badging.txt"
            if [ "$CHANNEL" = stable ]; then PACKAGE=com.dd3boh.outertune; else PACKAGE=com.dd3boh.outertune.preview; fi
            grep -q "package: name='${PACKAGE}' versionCode='92' versionName='0.11.1'" "apk-${CHANNEL}-badging.txt"
            cp "$APK" "OuterTune-Bage340-0.11.1-v92-${CHANNEL}-unsigned.apk"
          done
          sha256sum OuterTune-Bage340-0.11.1-v92-*-unsigned.apk | tee SHA256SUMS.txt

      - name: Upload verified unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OuterTune-Bage340-0.11.1-v92-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            OuterTune-Bage340-0.11.1-v92-*-unsigned.apk
            apk-*-badging.txt
            SHA256SUMS.txt
